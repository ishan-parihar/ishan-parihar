# genome.toml — modules on, role → path map, module settings. Edit freely.
[genome]
schema_version = 2
modules = ["core", "agents", "records"]

[paths]
agents = "AGENTS.md"
state = "docs/handoff/STATE.md"
entry = "docs/handoff/README.md"
register = "TODO.md"
ledger = "docs/kb/CLOSED.md"
worklog = "docs/kb/WORKLOG.md"
asks = "docs/kb/ASKS.md"
plans = "docs/plans"
audits = "docs/audit"
runbook = "docs/RUNBOOK.md"
archive = "docs/archive"
readme = "README.md"
docs = "docs"
feed = "docs/kb/feed.md"
workflows = "docs/kb/workflows"

[core]
gate = "python3 scripts/lint_readmes.py --repo ishan-parihar --include-profile && python3 scripts/check_repo_links.py"
# the portfolio's own README rubric, run locally: GitHub Actions is not
# available for this portfolio, so the gate is the local check.
#
# `check_repo_links.py` was added 2026-10-31 because the rubric graded this README
# 12.00 / ALL CLEAN while four of its repo links named renamed repositories
# (social-forge -> switchpost, tg-cli -> tg-lyr, discord-cli -> discord-lyr, and
# igs-rust -> sourcehound). `gh repo view` FOLLOWS a rename and exits 0, so the
# check compares the returned repo NAME against the name the document claims.
# Chained with && so both must pass; the link check fails closed (exit 2) when
# neither `gh` nor `curl` can resolve, so an unverifiable run is never a pass.
worklog_form = "file"      # or "numbered" (worklog = a directory of NNNN-date-slug.md + INDEX.md)
archive_form = "flat"      # or "generations" (archive/<generation>/ + README manifest, no tombstones)
living_plans = []          # plans that evolve (phase rows, a 'Resume here' section)
# resume = "docs/plans/<living-plan>.md#Resume here"   # what `genome wake` shows
budgets = {}               # e.g. { "AGENTS.md" = 60000 } — bytes; entry surfaces stay cheap to read
emitters = [
  "python3 scripts/gen_vitals.py --write",
]
# `gen_vitals.py` re-renders the README's six-row vitals table from
# my-projects/docs/audit/portfolio-measurements.json, which the portfolio's own
# close re-derives. The page cannot drift from the engine while this runs: the
# check path exits 1 on disagreement, and an absent portfolio is a named skip
# (a repo cloned without its sibling is not a failure of this page).
checklist = []             # judgement items `genome close` reminds you of
never_commit = []          # globs `genome close` leaves out of the named-path commit list

# No [app] section, deliberately. There is no build here — the repo is a metric portfolio
# whose only programme is a workspace-lint run, and an app check that invented a toolchain
# for it would be noise, not integrity. The module stays honest: docs and dir shape are
# the two things that can actually rot in a repo like this, so those two are declared.
[docs]
required = ["README.md", "AGENTS.md"]
max_lines = 600

[ops]
dir_globs = ["assets", "docs", "scripts"]

[card]
architecture = "docs/kb/RANKING-RUBRIC.md"
status_into = "docs/handoff/STATE.md"
